name: CARBON Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      CARBON_VERSION_CODE: ${{ github.run_number }}
      CARBON_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
      HAS_KEYSTORE: ${{ secrets.CARBON_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Icon tooling
        run: npm install --no-save sharp @capacitor/assets

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.CARBON_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/carbon.keystore"

      - name: Build debug APK
        run: node scripts/android.mjs --apk --icons

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          CARBON_KEYSTORE: ${{ runner.temp }}/carbon.keystore
          CARBON_KEYSTORE_PASSWORD: ${{ secrets.CARBON_KEYSTORE_PASSWORD }}
          CARBON_KEY_ALIAS: ${{ secrets.CARBON_KEY_ALIAS }}
          CARBON_KEY_PASSWORD: ${{ secrets.CARBON_KEY_PASSWORD }}
        run: node scripts/android.mjs --release --skip-web

      - uses: actions/upload-artifact@v4
        with:
          name: CARBON-android-${{ env.CARBON_VERSION_NAME }}-${{ github.run_number }}
          path: release/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
